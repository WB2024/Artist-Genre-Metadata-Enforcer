services:
  music-genre-enforcer:
    image: wb20244/music-genre-enforcer:latest
    container_name: music-genre-enforcer
    user: "1000:1000"            # must own/write your music files
    environment:
      - TZ=Europe/London
    volumes:
      - ./config:/config         # config.json, artist_genres.json, history, backups
      - /mnt/Main20TB/Media/Audio/Music/Sources/Clean:/music
    ports:
      - 8320:8320
    network_mode: bridge         # default bridge; avoids allocating a new compose network
    restart: unless-stopped
